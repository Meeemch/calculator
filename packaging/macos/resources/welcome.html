<h2>Калькулятор (Python)</h2>
<p>Программа установит приложение <b>PyCalculator</b> в папку «Программы»
и команду <code>pycalculator</code> для запуска из терминала.</p>
<p>Возможности: арифметика, %, степень, sin, cos, √, floor, ceil, память (MC, MR, M+, M−).</p>
<p>Для работы нужен Python 3 с модулем tkinter.</p>
